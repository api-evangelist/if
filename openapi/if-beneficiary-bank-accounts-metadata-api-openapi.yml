openapi: 3.2.0
info:
  title: Outgoing Transfer Beneficiary Bank Accounts Metadata API
  description: Operations for Outgoing Transfers
  version: '1'
servers:
- url: https://sandbox-api.integrated.finance/v1/{instanceId}
  description: Sandbox
  variables: {}
- url: https://api.integrated.finance/v1/{instanceId}
  description: Production
  variables: {}
tags:
- name: Beneficiary Bank Accounts Metadata
paths:
  /beneficiary-bank-account-requirements:
    get:
      tags:
      - Beneficiary Bank Accounts Metadata
      summary: Get Beneficiary Bank Account Metadata
      operationId: beneficiaries.bankAccounts.requirements.get
      responses:
        '200':
          description: Beneficiary bank account metadata returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryBankAccountMetadataResponse'
components:
  schemas:
    BeneficiaryBankAccountMetadataDataContainer:
      required:
      - beneficiaryAddress
      - beneficiaryBankAccount
      type: object
      properties:
        beneficiaryBankAccount:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataResource'
        beneficiaryAddress:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataAddressResource'
    BeneficiaryRequirementsResource:
      type: object
      properties:
        beneficiaryAddress:
          $ref: '#/components/schemas/FieldOptionType'
      description: beneficiary requirements
    BeneficiaryBankAccountMetadataResponse:
      required:
      - connect
      - data
      - metadata
      - workflow
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataWorkflowContainer'
        data:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataDataContainer'
        connect:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataConnectContainer'
        metadata:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataMetadataContainer'
    BeneficiaryBankAccountMetadataResource:
      required:
      - beneficiaryBankAccountAccountNumberMetadata
      - beneficiaryBankAccountBankNameMetadata
      - beneficiaryBankAccountIbanMetadata
      - beneficiaryBankAccountRoutingCodesMetadata
      - beneficiaryRequirements
      type: object
      properties:
        beneficiaryRequirements:
          $ref: '#/components/schemas/BeneficiaryRequirementsResource'
        beneficiaryBankAccountIbanMetadata:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        beneficiaryBankAccountAccountNumberMetadata:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        beneficiaryBankAccountBankNameMetadata:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        beneficiaryBankAccountRoutingCodesMetadata:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
          description: beneficiary bank account routing codes metadata
      description: beneficiary bank account metadata model
    BeneficiaryBankAccountMetadataConnectContainer:
      type: object
    BeneficiaryBankAccountFieldMetadataResourceString:
      required:
      - beneficiaryBankAccountFieldRegex
      - requirement
      type: object
      properties:
        beneficiaryBankAccountFieldRegex:
          type: string
          description: beneficiary bank account field metadata regex
        requirement:
          $ref: '#/components/schemas/FieldOptionType'
    BeneficiaryBankAccountMetadataMetadataContainer:
      type: object
    BeneficiaryBankAccountMetadataAddressResource:
      type: object
      properties:
        country:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        region:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        city:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        street:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        houseNumber:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        postalCode:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        refinement:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
      description: beneficiary bank account address metadata
    BeneficiaryBankAccountMetadataWorkflowContainer:
      type: object
    FieldOptionType:
      type: string
      description: beneficiary bank account field metadata requirement
      enum:
      - none
      - optional
      - required

        '400':
          description: Missing required field
          content:
            application/json:
              examples:
                error-required-validation:
                  description: error-required-validation
                  value:
                    timestamp: '2023-02-12T13:06:35.0286835'
                    message: Parameter data.client.identity cannot be null or empty.
                    code: common.coding.functional.invalid_input
                    messageParameters:
                    - data.client.identity
  /clients/{id}:
    get:
      tags:
      - Clients
      summary: Get a Client
      operationId: clients.get
      parameters:
      - name: metadata.include
        in: query
        description: include additional information about the client
        style: form
        schema:
          type: string
          enum:
          - data.client.profile.primaryAddress
          - data.client.profile.registrationAddress
          - data.client.profile.residentialAddress
          - connect.connections
      - name: id
        in: path
        description: ID of the client in UUID format
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Client resource returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientGetResponse'
              examples:
                default-response:
                  description: default-response

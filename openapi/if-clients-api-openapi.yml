components:
  schemas:
    ClientCreateWorkflow:
      type: string
      description: unique workflow code
      enum:
      - direct
      - migration
    BankingUserProfile:
      type: object
      properties:
        phone:
          type: string
        residentialAddress:
          $ref: '#/components/schemas/Address'
    ClientUpdateRequest:
      required:
      - connect
      - data
      - metadata
      - workflow
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/ClientUpdateWorkflowContainer'
        data:
          $ref: '#/components/schemas/ClientUpdateDataContainer'
        connect:
          $ref: '#/components/schemas/ClientUpdateConnectContainer'
        metadata:
          $ref: '#/components/schemas/ClientUpdateMetadataContainer'
    ClientRisk:
      type: string
      description: client risk level
      enum:
      - low
      - medium
      - high
      - severe
    ClientUpdateConnect:
      type: string
      description: connect type
      enum:
      - explicit
      - explicit
    UserIdentityResource:
      required:
      - familyName
      - givenName
      - type
      type: object
      properties:
        type:
          $ref: '#/components/schemas/LegalEntityType'
        givenName:
          type: string
          description: user given name
        familyName:
          type: string
          description: user family name
        birthDate:
          type: string
          description: user birthdate
          format: date
      description: user identity information
    ClientCreateRequest:
      required:
      - connect
      - data
      - metadata
      - workflow
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/ClientCreateWorkflowContainer'
        data:
          $ref: '#/components/schemas/ClientCreateDataContainer'
        connect:
          $ref: '#/components/schemas/ClientCreateConnectContainer'
        metadata:
          $ref: '#/components/schemas/ClientCreateMetadataContainer'
    LegalEntityIdentityIndividual:
      required:
      - familyName
      - givenName
      type: object
      allOf:
      - $ref: '#/components/schemas/LegalEntityIdentity'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/LegalEntityType'
          country:
            maxLength: 2
            minLength: 2
            pattern: ^[A-Z]{2}$
            type: string
          identifications:
            type: array
            items:
              $ref: '#/components/schemas/LegalEntityIdentification'
          givenName:
            type: string
          familyName:
            type: string
          birthDate:
            type: string
            format: date
    ClientUpdateDataContainer:
      type: object
      properties:
        client:
          type: object
          additionalProperties:
            type: object
            description: custom map including fields to update, required if workflow is direct
          description: custom map including fields to update, required if workflow is direct
        sourceId:
          type: string
          description: id of the client to be migrated, required if workflow is migration
          writeOnly: true
    ClientUpdateResponse:
      required:
      - connect
      - data
      - metadata
      - workflow
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/ClientUpdateWorkflowContainer'
        data:
          $ref: '#/components/schemas/ClientUpdateDataContainer'
        connect:
          $ref: '#/components/schemas/ClientUpdateConnectContainer'
        metadata:
          $ref: '#/components/schemas/ClientUpdateMetadataContainer'
    ClientListDataContainer:
      required:
      - clients
      type: object
      properties:
        client:
          $ref: '#/components/schemas/ClientResourceListQueryInput'
        clients:
          type: array
          description: collection of clients
          readOnly: true
          items:
            $ref: '#/components/schemas/Client'
    ClientRelatedLegalEntityRelation:
      type: string
      description: relation of legal entity with client
      enum:
      - director
      - shareholder
      - director-and-shareholder
      - authorized-person
    UserClientStatus:
      type: string
      readOnly: true
      enum:
      - allowed
      - revoked
    BankingUserStatus:
      type: string
      readOnly: true
      enum:
      - active
      - inactive
    ClientRelation:
      required:
      - clientId
      - id
      - identity
      - relation
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/AttributeMap'
        id:
          type: string
          description: client relation id
          format: uuid
          readOnly: true
        clientId:
          type: string
          description: id of client
          format: uuid
          readOnly: true
        relation:
          $ref: '#/components/schemas/ClientRelatedLegalEntityRelation'
        identity:
          type: object
          description: client relation identity object
          oneOf:
          - $ref: '#/components/schemas/LegalEntityIdentityCorporate'
          - $ref: '#/components/schemas/LegalEntityIdentityIndividual'
        percentageOfOwnership:
          type: number
          description: percentage of ownership
        profile:
          type: object
          description: client relation profile object
          oneOf:
          - $ref: '#/components/schemas/ClientProfileCorporate'
          - $ref: '#/components/schemas/ClientProfileIndividual'
      description: client relation data model
    ClientUpdateWorkflow:
      type: string
      description: unique workflow code
      enum:
      - direct
      - migration
    ClientGetConnectContainer:
      type: object
      properties:
        connections:
          type: array
          description: client connection data models
          items:
            $ref: '#/components/schemas/ClientConnection'
    ClientCreateMetadataContainer:
      type: object
    ClientGetDataContainer:
      required:
      - client
      type: object
      properties:
        client:
          $ref: '#/components/schemas/Client'
    LegalEntityIdentityCorporate:
      required:
      - legalName
      type: object

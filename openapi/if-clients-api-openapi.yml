openapi: 3.2.0
info:
  title: Clients API
  description: Operations for Clients
  version: '1'
servers:
- url: https://sandbox-api.integrated.finance/v1/{instanceId}
  description: Sandbox
  variables: {}
- url: https://api.integrated.finance/v1/{instanceId}
  description: Production
  variables: {}
tags:
- name: Clients
paths:
  /clients:
    get:
      tags:
      - Clients
      summary: List Clients
      operationId: clients.list
      parameters:
      - name: metadata.page.number
        in: query
        description: 0-indexed page number
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: metadata.page.size
        in: query
        description: page size
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      - name: metadata.sort
        in: query
        description: default direction is ascending
        schema:
          type: string
        example: data.client.fullName,desc
      - name: data.client.identity.type
        in: query
        schema:
          $ref: '#/components/schemas/LegalEntityType'
      - name: data.client.fullName
        in: query
        schema:
          type: string
      - name: data.client.status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
      - name: data.client.clientNumber
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Client list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
              example: '{  "workflow": {},  "data": {    "clients": [      {        "id": "59f39ef4-31e7-495d-9deb-c483e817a02c",        "clientNumber": "21429493",        "status": "active",        "identity": {          "type": "corporate",          "country": "GB",          "identifications": null,          "legalName": "I.F Technology Ltd",          "incorporationDate": "2019-09-09",          "corporationType": null        },        "profile": {          "identityType": "corporate"          "phone": "+441234567890",          "email": "test@integrated.finance"        },        "fullName": "I.F Technology Ltd"      },      {        "id": "94fdd97a-8f63-4406-9d4e-e946848ae9bb",        "clientNumber": "23668817",        "status": "active",        "identity": {          "type": "individual",          "country": "GB",          "identifications": [            {              "type": "identity-card",              "identificationNumber": "12345678",              "issuingCountry": "GB",              "issueDate": "2022-01-01",              "expirationDate": "2032-01-01"            }          ],          "givenName": "Sherlock",          "familyName": "Holmes",          "birthDate": "1953-01-06"        },        "profile": {          "identityType": "individual",          "phone": "+441234567890"        },        "fullName": "Sherlock Holmes"      }    ]  },  "connect": {},  "metadata": {    "page": {      "size": 20,      "number": 0,      "totalElements": 2,      "totalPages": 1    }  }}'
    post:
      tags:
      - Clients
      summary: Create a Client
      operationId: clients.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
            examples:
              direct-individual:
                description: direct-individual
                value:
                  workflow:
                    code: direct
                  data:
                    client:
                      identity:
                        type: individual
                        givenName: Sherlock
                        familyName: Holmes
                        birthDate: '1953-01-06'
                        country: GB
                        identifications:
                        - type: identity-card
                          identificationNumber: '12345678'
                          issuingCountry: GB
                          issueDate: '2022-01-01'
                          expirationDate: '2032-01-01'
                      profile:
                        identityType: individual
                        phone: '+441234567890'
                        email: test@integrated.finance
                        residentialAddress:
                          country: GB
                          region: England
                          city: London
                          street: Baker Street
                          houseNumber: 221B
                          postalCode: XYZ ABC
                          refinement: ''
                  connect: {}
                  metadata: {}
              direct-individual-with-user:
                description: direct-individual-with-user
                value:
                  workflow:
                    code: direct
                    createUser: true
                  data:
                    client:
                      identity:
                        type: individual
                        givenName: Bruce
                        familyName: Wayne
                        birthDate: '1987-01-01'
                        country: GB
                        identifications:
                        - type: identity-card
                          identificationNumber: '12345678'
                          issuingCountry: GB
                          issueDate: '2022-01-01'
                          expirationDate: '2023-01-01'
                      profile:
                        identityType: individual
                        residentialAddress:
                          country: GB
                          region: England
                          city: London
                          street: Baker Street
                          houseNumber: 221B
                          postalCode: XYZ ABC
                          refinement: ''
                        phone: '+441234567890'
                        email: abc@integrated.finance
                  connect: {}
                  metadata: {}
              direct-corporate:
                description: direct-corporate
                value:
                  workflow:
                    code: direct
                  data:
                    client:
                      identity:
                        type: corporate
                        legalName: I.F Technology Ltd
                        incorporationDate: '2019-01-01'
                        country: GB
                        identifications:
                        - type: registration-number
                          identificationNumber: '12345678'
                          issuingCountry: GB
                      profile:
                        identityType: corporate
                        phone: '+441234567890'
                        email: test@integrated.finance
                        registrationAddress:
                          country: GB
                          region: England
                          city: London
                          street: City Road
                          houseNumber: Epworth House
                          postalCode: EC1Y 1AA
                          refinement: ''
                      relations:
                      - relation: director
                        identity:
                          type: individual
                          givenName: John
                          familyName: Doe
                          birthDate: '2000-01-01'
                          country: GB
                          identifications:
                          - type: passport
                            identificationNumber: '12345678'
                            issuingCountry: GB
                        profile:
                          identityType: individual
                          phone: '+441234567890'
                          email: test@integrated.finance
                          residentialAddress:
                            country: GB
                            region: England
                            city: London
                            street: Baker Street
                            houseNumber: 221B
                            postalCode: XYZ ABC
                            refinement: ''
                          percentageOfOwnership: '55'
                  connect: {}
                  metadata: {}
              migration:
                description: migration
                value:
                  workflow:
                    code: migration
                  data:
                    sourceId: 00000000-0000-0000-0000-000000000000
                  connect:
                    type: explicit
                    serviceProvider: currencycloud
                  metadata: {}

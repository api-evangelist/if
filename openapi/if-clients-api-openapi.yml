    patch:
      tags:
      - Clients
      summary: Update a Client
      operationId: clients.update
      parameters:
      - name: id
        in: path
        description: ID of the client in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateRequest'
            examples:
              corporate-name-update:
                description: corporate-name-update
                value:
                  workflow:
                    code: direct
                  data:
                    client:
                      identity:
                        type: corporate
                        legalName: I.F Technology Corp
                  connect: {}
                  metadata: {}
              individual-address-update:
                description: individual-address-update
                value:
                  workflow:
                    code: direct
                  data:
                    client:
                      profile:
                        identityType: individual
                        phone: '+441234567890'
                        email: test@integrated.finance
                        residentialAddress:
                          country: GB
                          region: England
                          city: London

    patch:
      tags:
      - Open Banking Consents
      summary: Update an Open Banking Consent
      operationId: open-banking-consent.update
      parameters:
      - name: openBankingCode
        in: path
        description: Alpha 2 code of the open banking country
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: ID of the consent
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountOpenBankingConsentUpdateRequest'
            example:
              workflow:
                code: direct
              data:
                consent:
                  action: approve
                  userId: 00000000-0000-0000-0000-000000000000
                  accounts:
                  - 00000000-0000-0000-0000-000000000000
                  - 00000000-0000-0000-0000-000000000000
              connect: {}
              metadata: {}
      responses:
        '201':
          description: Open banking consent updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOpenBankingConsentUpdateResponse'
              example:
                workflow:
                  code: direct
                data:
                  resource:
                    location: https://example.company_return#code={code}&state={state}&id_token={token}
                connect: {}
                metadata: {}
components:

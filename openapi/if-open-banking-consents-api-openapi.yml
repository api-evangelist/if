      properties:
        code:
          type: string
          description: workflow code
          enum:
          - direct
      description: workflow container
    OpenBankingConsentListPlatformQueryInput:
      type: object
      properties:
        userId:
          type: string
    AccountOpenBankingConsentUpdateRequest:
      required:
      - connect
      - data
      - metadata
      - workflow
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/AccountOpenBankingConsentUpdateWorkflowContainer'
        data:
          $ref: '#/components/schemas/AccountOpenBankingConsentUpdateDataContainer'
        connect:
          $ref: '#/components/schemas/AccountOpenBankingConsentUpdateConnectContainer'
        metadata:
          $ref: '#/components/schemas/AccountOpenBankingConsentUpdateMetadataContainer'
      description: request model
    OpenBankingConsentListDataContainer:
      type: object
      properties:
        consent:
          $ref: '#/components/schemas/OpenBankingConsentListPlatformQueryInput'
        consents:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/OpenBankingConsent'
    OpenBankingConsentListResponse:
      required:
      - connect
      - data
      - metadata
      - workflow
      type: object
      properties:

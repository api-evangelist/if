paths:
  /open-banking/{openBankingCode}/consents:
    get:
      tags:
      - Open Banking Consents
      summary: List Open Banking Consents
      operationId: open-banking-consent.list
      parameters:
      - name: openBankingCode
        in: path
        description: code of the open banking standard
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Open banking consent list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenBankingConsentListResponse'
              example:
                workflow: '{}'
                data:
                  consents:
                  - id: 00000000-0000-0000-0000-000000000000
                    thirdPartyProvider:
                      name: Example Company
                      website: https://example.company
                      applicationName: Example Company Integration
                      applicationDescription: Example Company Integration
                      applicationWebsite: https://example.company

        connect:
          $ref: '#/components/schemas/OpenBankingConsentListConnectContainer'
        metadata:
          $ref: '#/components/schemas/OpenBankingConsentListMetadataContainer'
    ThirdPartyOpenBankingProvider:
      type: object
      properties:
        name:
          type: string
        website:
          type: string
        applicationName:
          type: string
        applicationDescription:
          type: string
        applicationWebsite:
          type: string
      description: parameters of open banking provider
    OpenBankingConsent:
      type: object
      properties:
        id:
          type: string
          description: id of open banking consent
        thirdPartyProvider:
          $ref: '#/components/schemas/ThirdPartyOpenBankingProvider'
        status:
          $ref: '#/components/schemas/OpenBankingConsentStatus'
        content:
          $ref: '#/components/schemas/OpenBankingConsentContentResource'
        requestCreatedDateTime:
          type: string
          description: Date & time that the consent request was created
          format: date-time
        requestDateTime:
          type: string
          description: Date & time that the consent request was created
          format: date-time
        requestExpiryDateTime:
          type: string
          description: Date & time that the consent request expires (or expired)
          format: date-time
        grantedDateTime:
          type: string
          description: Date & time that the consent was granted
          format: date-time
        grantDateTime:
          type: string
          description: Date & time that the consent was granted
          format: date-time
        expiryDateTime:
          type: string
          description: Date & time that the consent expires / expired
          format: date-time
        grantExpiryDateTime:
          type: string
          description: Date & time that the consent expires / expired
          format: date-time
        revokedDateTime:
          type: string
          description: Date & time that the consent was revoked by the account holder
          format: date-time
      description: Open Banking Consent Resource Object
    AccountOpenBankingConsentUpdateConnectContainer:
      type: object
      description: connect container
    AccountOpenBankingConsentUpdateDataContainer:
      type: object
      properties:
        consent:
          type: object
          additionalProperties:
            type: object
            description: custom map including fields to update
          description: custom map including fields to update
        account open banking consent:
          $ref: '#/components/schemas/AccountOpenBankingConsentOutput'
      description: data container
    AccountOpenBankingConsentUpdateResponse:
      required:
      - connect
      - data
      - metadata
      - workflow
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/AccountOpenBankingConsentUpdateWorkflowContainer'
        data:
          $ref: '#/components/schemas/AccountOpenBankingConsentUpdateDataContainer'
        connect:
          $ref: '#/components/schemas/AccountOpenBankingConsentUpdateConnectContainer'
        metadata:
          $ref: '#/components/schemas/AccountOpenBankingConsentUpdateMetadataContainer'
      description: response model
    OpenBankingConsentListConnectContainer:
      type: object
    OpenBankingConsentListWorkflow:
      type: object
      description: Descriptor that navigates IF platform from which workflow does that operation runs
    OpenBankingConsentContentResource:
      required:
      - scope
      type: object
      properties:
        scope:
          type: string
      description: content of open banking consent
      discriminator:
        propertyName: scope
    AccountOpenBankingConsentOutput:
      type: object
      properties:
        location:
          type: string
        consent:
          $ref: '#/components/schemas/OpenBankingConsent'
      description: account open banking consent data model
      readOnly: true
    OpenBankingConsentStatus:
      type: string
      description: status of open banking consent
      enum:
      - awaiting-authorisation
      - awaiting-exchange
      - authorisation-declined
      - authorised
      - revoked
      - expired
      - rejected
      - consumed
    OpenBankingConsentListMetadataContainer:
      type: object

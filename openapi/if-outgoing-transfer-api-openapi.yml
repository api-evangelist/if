openapi: 3.0.1
info:
  title: Outgoing Transfer API
  description: Operations for Outgoing Transfers
  version: '1'
servers:
- url: https://sandbox-api.integrated.finance/v1/{instanceId}
  description: Sandbox
  variables: {}
- url: https://api.integrated.finance/v1/{instanceId}
  description: Production
  variables: {}
paths:
  /accounts/{accountId}/outgoing-transfer-date-metadata/{transferScope}/{transferScheme}:
    get:
      tags:
      - Outgoing Transfers Metadata
      summary: Get Date Metadata
      operationId: outgoing-transfers.date-metadata.get
      parameters:
      - name: accountId
        in: path
        description: ID of source account
        required: true
        schema:
          type: string
          format: uuid
      - name: transferScope
        in: path
        description: transfer scope
        required: true
        schema:
          $ref: '#/components/schemas/TransferScope'
      - name: transferScheme
        in: path
        description: transfer scheme
        required: true
        schema:
          $ref: '#/components/schemas/TransferScheme'
      responses:
        '200':
          description: Date metadata returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingTransferDateMetadataResponse'
  /beneficiaries:
    get:
      tags:
      - Beneficiaries
      summary: List Beneficiaries
      operationId: beneficiaries.list
      responses:
        '200':
          description: Beneficiary list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryListResponse'
    post:
      tags:
      - Beneficiaries
      summary: Create a Beneficiary
      operationId: beneficiaries.create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/BeneficiaryCreateRequest'
        required: true
      responses:
        '201':
          description: Beneficiary created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryCreateResponse'
  /beneficiaries/{beneficiaryId}/bank-accounts:
    get:
      tags:
      - Beneficiary Bank Accounts
      summary: List Beneficiary Bank Accounts
      operationId: beneficiaries.bankAccounts.list
      parameters:
      - name: beneficiaryId
        in: path
        description: ID of beneficiary in UUID format
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Beneficiary bank account list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryBankAccountsListResponse'
    post:
      tags:
      - Beneficiary Bank Accounts
      summary: Create a Beneficiary Bank Account
      operationId: beneficiaries.bankAccounts.create
      parameters:
      - name: beneficiaryId
        in: path
        description: ID of beneficiary in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/BeneficiaryBankAccountCreateRequest'
        required: true
      responses:
        '201':
          description: Beneficiary bank account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryCreateResponse'
  /beneficiaries/{beneficiaryId}/bank-accounts/{id}:
    get:
      tags:
      - Beneficiary Bank Accounts
      summary: Get a Beneficiary Bank Account
      operationId: beneficiaries.bankAccounts.get
      parameters:
      - name: beneficiaryId
        in: path
        description: ID of beneficiary in UUID format
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: ID of beneficiary bank account in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/BeneficiaryBankAccountsGetResponse'
      responses:
        '200':
          description: Beneficiary bank account returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryBankAccountsGetResponse'
    patch:
      tags:
      - Beneficiary Bank Accounts
      summary: Update a Beneficiary Bank Account
      operationId: beneficiaries.bankAccounts.update
      parameters:
      - name: beneficiaryId
        in: path
        description: ID of beneficiary in UUID format
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: ID of beneficiary bank account in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/BeneficiaryBankAccountUpdateRequest'
        required: true
      responses:
        '202':
          description: Beneficiary bank account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryBankAccountUpdateResponse'
  /beneficiaries/{id}:
    get:
      tags:
      - Beneficiaries
      summary: Get a Beneficiary
      operationId: beneficiaries.get
      parameters:
      - name: id
        in: path
        description: ID of the beneficiary in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/BeneficiaryGetResponse'
      responses:
        '200':
          description: Beneficiary returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryGetResponse'
    patch:
      tags:
      - Beneficiaries
      summary: Update a Beneficiary
      operationId: beneficiaries.update
      parameters:
      - name: id
        in: path
        description: ID of beneficiary in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/BeneficiaryUpdateRequest'
        required: true
      responses:
        '202':
          description: Beneficiary updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientUpdateResponse'
  /beneficiary-bank-account-requirements:
    get:
      tags:
      - Beneficiary Bank Accounts Metadata
      summary: Get Beneficiary Bank Account Metadata
      operationId: beneficiaries.bankAccounts.requirements.get
      responses:
        '200':
          description: Beneficiary bank account metadata returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryBankAccountMetadataResponse'
  /beneficiary-verifications:
    post:
      tags:
      - Beneficiary Verifications
      summary: Verify Beneficiary
      operationId: beneficiary-verifications.create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/BeneficiaryVerificationRequest'
        required: true
      responses:
        '200':
          description: Beneficiary verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryVerificationResponse'
  /direct-debit-mandates:
    get:
      tags:
      - Direct Debit Mandates
      summary: List Direct Debit Mandates
      operationId: direct-debit-mandates.list
      responses:
        '200':
          description: Direct debit mandate list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitMandateListResponse'
    post:
      tags:
      - Direct Debit Mandates
      summary: Create a Direct Debit Mandate
      operationId: direct-debit-mandates.create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/DirectDebitMandateCreateRequest'
        required: true
      responses:
        '201':
          description: Direct debit mandate created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitMandateCreateResponse'
  /direct-debit-mandates/{id}:
    get:
      tags:
      - Direct Debit Mandates
      summary: Get a Direct Debit Mandate
      operationId: direct-debit-mandates.get
      parameters:
      - name: id
        in: path
        description: ID of the direct debit mandate in UUID format
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Direct debit mandate returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitMandateGetResponse'
    patch:
      tags:
      - Direct Debit Mandates
      summary: Update a Direct Debit Mandate
      operationId: direct-debit-mandates.update
      parameters:
      - name: id
        in: path
        description: ID of the direct debit mandate in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectDebitMandateUpdateRequestBody'
        required: true
      responses:
        '202':
          description: Direct debit mandate updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitMandateUpdateResponse'
  /direct-debit-payments:
    get:
      tags:
      - Direct Debit Payments
      summary: List Direct Debit Payments
      operationId: direct-debit-payments.list
      responses:
        '200':
          description: Direct debit payment list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitPaymentListResponse'
  /direct-debit-payments/{id}:
    get:
      tags:
      - Direct Debit Payments
      summary: Get a Direct Debit Payment
      operationId: direct-debit-payments.get
      parameters:
      - name: id
        in: path
        description: ID of the direct debit payment in UUID format
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Direct debit payment returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitPaymentGetResponse'
    patch:
      tags:
      - Direct Debit Payments
      summary: Update a Direct Debit Payment
      operationId: direct-debit-payments.update
      parameters:
      - name: id
        in: path
        description: ID of the direct debit payment in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectDebitPaymentUpdateRequestBody'
        required: true
      responses:
        '202':
          description: Direct debit payment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitPaymentUpdateResponse'
  /outgoing-transfers:
    get:
      tags:
      - Outgoing Transfers
      summary: List Outgoing Transfers
      operationId: outgoing-transfers.list
      responses:
        '200':
          description: Outgoing transfer list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingTransferListResponse'
    post:
      tags:
      - Outgoing Transfers
      summary: Create an Outgoing Transfer
      operationId: outgoing-transfers.create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/OutgoingTransferCreateRequest'
        required: true
      responses:
        '200':
          description: Outgoing transfer validated successfully using dry run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingTransferCreateResponse'
        '201':
          description: Outgoing transfer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingTransferCreateResponse'
  /outgoing-transfers/{id}:
    get:
      tags:
      - Outgoing Transfers
      summary: Get an Outgoing Transfer
      operationId: outgoing-transfers.get
      parameters:
      - name: id
        in: path
        description: ID of outgoing transfer in UUID format
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Outgoing transfer returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingTransferGetResponse'
    patch:
      tags:
      - Outgoing Transfers
      summary: Update an Outgoing Transfer
      operationId: outgoing-transfers.update
      parameters:
      - name: id
        in: path
        description: ID of outgoing transfer in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/OutgoingTransferUpdateRequest'
        required: true
      responses:
        '202':
          description: Outgoing transfer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingTransferUpdateResponse'
  /outgoing-transfers/{id}/compliance-check:
    get:
      tags:
      - Outgoing Transfers - Compliance
      summary: Get Compliance Check of an Outgoing Transfer
      operationId: outgoing-transfers.compliance-check.get
      parameters:
      - name: id
        in: path
        description: ID of outgoing transfer in UUID format
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Compliance check of outgoing transfer returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCheckGetResponse'
    patch:
      tags:
      - Outgoing Transfers - Compliance
      summary: Update Compliance Check of an Outgoing Transfer
      operationId: outgoing-transfers.compliance-check.update
      parameters:
      - name: id
        in: path
        description: ID of outgoing transfer in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/ComplianceCheckUpdateRequest'
      responses:
        '202':
          description: Compliance information updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCheckUpdateResponse'
  /transaction-accounts/{transactionAccountId}/outgoing-transfer-date-metadata/{transferScope}/{transferScheme}:
    get:
      tags:
      - Outgoing Transfers Metadata
      summary: Get Transfer Date Metadata
      operationId: outgoing-transfers.date-metadata.get_1
      parameters:
      - name: transactionAccountId
        in: path
        description: ID of source account
        required: true
        schema:
          type: string
          format: uuid
      - name: transferScope
        in: path
        description: transfer scope
        required: true
        schema:
          $ref: '#/components/schemas/TransferScope'
      - name: transferScheme
        in: path
        description: transfer scheme
        required: true
        schema:
          $ref: '#/components/schemas/TransferScheme'
      responses:
        '200':
          description: Date metadata returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingTransferDateMetadataResponse'
components:
  schemas:
    BeneficiaryBankAccountFieldMetadataResourceString:
      required:
      - beneficiaryBankAccountFieldRegex
      - requirement
      type: object
      properties:
        beneficiaryBankAccountFieldRegex:
          type: string
          description: beneficiary bank account field metadata regex
        requirement:
          $ref: '#/components/schemas/FieldOptionType'
    BeneficiaryBankAccountMetadataAddressResource:
      type: object
      properties:
        country:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        region:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        city:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        street:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        houseNumber:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        postalCode:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        refinement:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
      description: beneficiary bank account address metadata
    BeneficiaryBankAccountMetadataConnectContainer:
      type: object
    BeneficiaryBankAccountMetadataDataContainer:
      required:
      - beneficiaryAddress
      - beneficiaryBankAccount
      type: object
      properties:
        beneficiaryBankAccount:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataResource'
        beneficiaryAddress:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataAddressResource'
    BeneficiaryBankAccountMetadataMetadataContainer:
      type: object
    BeneficiaryBankAccountMetadataResource:
      required:
      - beneficiaryBankAccountAccountNumberMetadata
      - beneficiaryBankAccountBankNameMetadata
      - beneficiaryBankAccountIbanMetadata
      - beneficiaryBankAccountRoutingCodesMetadata
      - beneficiaryRequirements
      type: object
      properties:
        beneficiaryRequirements:
          $ref: '#/components/schemas/BeneficiaryRequirementsResource'
        beneficiaryBankAccountIbanMetadata:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        beneficiaryBankAccountAccountNumberMetadata:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        beneficiaryBankAccountBankNameMetadata:
          $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
        beneficiaryBankAccountRoutingCodesMetadata:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BeneficiaryBankAccountFieldMetadataResourceString'
          description: beneficiary bank account routing codes metadata
      description: beneficiary bank account metadata model
    BeneficiaryBankAccountMetadataResponse:
      required:
      - connect
      - data
      - metadata
      - workflow
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataWorkflowContainer'
        data:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataDataContainer'
        connect:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataConnectContainer'
        metadata:
          $ref: '#/components/schemas/BeneficiaryBankAccountMetadataMetadataContainer'
    BeneficiaryBankAccountMetadataWorkflowContainer:
      type: object
    BeneficiaryRequirementsResource:
      type: object
      properties:
        beneficiaryAddress:
          $ref: '#/components/schemas/FieldOptionType'
      description: beneficiary requirements
    FieldOptionType:
      type: string
      description: beneficiary bank account field metadata requirement
      enum:
      - none
      - optional
      - required
    TransferScheme:
      type: string
      description: transfer scheme depending on the scope of the transfer
      enum:
      - swift
      - local
      - sepa
      - sepa-instant
      - sepa-target-2
      - sepa-target-2-pacs009
      - sepa-direct-debit
      - chaps
      - bacs
      - faster-payments
      - faster-payments-poo
      - npp
      - becs
      - rits
      - tips-dkk
      - intradag
      - t2-dkk
      - rix-inst
      - rix-rtgs
      - swish
      - nbo
      - viber
      - sic-inst
      - sic-ach
      - sic-rtgs
      - chats
      - ach
      - wire
      - eft
    OutgoingTransferDateMetadataConnectContainer:
      type: object
      description: connect container
    OutgoingTransferDateMetadataDataContainer:
      type: object
      properties:
        nextAvailableDateFrom:
          type: string
          format: date
        nextAvailableDate:
          type: string
          description: next available date for transfers with given properties
          format: date
          readOnly: true
        nextCutoffDateTime:
          type: string
          description: cutoff date time for next available date, null if payment scheme supports 24/7
          format: date-time
          readOnly: true
        unavailableDates:
          uniqueItems: true
          type: array
          description: array of unavailable dates for transfer with given properties
          readOnly: true
          items:
            type: string
            description: array of unavailable dates for transfer with given properties
            format: date
            readOnly: true
      description: data container
    OutgoingTransferDateMetadataMetadataContainer:
      type: object
      description: metadata container
    OutgoingTransferDateMetadataResponse:
      required:
      - connect
      - data
      - metadata
      - workflow
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/OutgoingTransferDateMetadataWorkflowContainer'
        data:
          $ref: '#/components/schemas/OutgoingTransferDateMetadataDataContainer'
        connect:
          $ref: '#/components/schemas/OutgoingTransferDateMetadataConnectContainer'
        metadata:
          $ref: '#/components/schemas/OutgoingTransferDateMetadataMetadataContainer'
      description: response model
    OutgoingTransferDateMetadataWorkflowContainer:
      type: object
      description: workflow container
    TransferScope:
      type: string
      description: transfer scope
      enum:
      - internal
      - external
      - internal
      - external
    LegalEntityType:
      type: string
      enum:
      - corporate
      - individual
    RoutingCodeMap:
      type: object
    Owner:
      type: string
      enum:
      - organization
      - client
    PageMetadata:
      required:
      - number
      - size
      - totalElements
      - totalPages
      type: object
      properties:
        size:
          minimum: 0
          type: integer
          description: number of elements in this page
          format: int32
        number:
          minimum: 0
          type: integer
          description: index of page starting from 0
          format: int32
        totalElements:
          minimum: 0
          type: integer
          description: total number of elements in all of the pages
          format: int64
          readOnly: true
        totalPages:
          minimum: 0
          type: integer
          description: number of total pages
          format: int32
          readOnly: true
    Address:
      required:
      - city
      - country
      - street
      type: object
      properties:
        country:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
          type: string
        region:
          type: string
        postalCode:
          type: string
        city:
          type: string
        street:
          type: string
        houseNumber:
          type: string
        refinement:
          type: string
    CorporationType:
      type: string
      enum:
      - ltd
      - plc
      - llp
      - lp
      - gp
      - st
      - other
    LegalEntityIdentification:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/LegalEntityIdentificationType'
        identificationNumber:
          type: string
        issuingCountry:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
          type: string
        issueDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
    LegalEntityIdentificationType:
      type: string
      enum:
      - registration-number
      - passport
      - identity-card
      - driving-licence
      - foreign-identity-card
      - tax-number
    LegalEntityIdentity:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
        mapping:
          corporate: '#/components/schemas/LegalEntityIdentityCorporate'
          individual: '#/components/schemas/LegalEntityIdentityIndividual'
    LegalEntityIdentityCorporate:
      required:
      - legalName
      type: object
      allOf:
      - $ref: '#/components/schemas/LegalEntityIdentity'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/LegalEntityType'
          country:
            maxLength: 2
            minLength: 2
            pattern: ^[A-Z]{2}$
            type: string
          identifications:
            type: array
            items:
              $ref: '#/components/schemas/LegalEntityIdentification'
          legalName:
            type: string
          incorporationDate:
            type: string
            format: date
          corporationType:
            $ref: '#/components/schemas/CorporationType'
    LegalEntityIdentityIndividual:
      required:
      - familyName
      - givenName
      type: object
      allOf:
      - $ref: '#/components/schemas/LegalEntityIdentity'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/LegalEntityType'
          country:
            maxLength: 2
            minLength: 2
            pattern: ^[A-Z]{2}$
            type: string
          identifications:
            type: array
            items:
              $ref: '#/components/schemas/LegalEntityIdentification'
          givenName:
            type: string
          familyName:
            type: string
          birthDate:
            type: string
            format: date
    AttributeMap:
      type: object
      description: outgoing transfer attributes
    ClientAccountOutgoingTransferSourceResource:
      type: object
      description: source container for transfers from client accounts
      allOf:
      - $ref: '#/components/schemas/OutgoingTransferSourceResource'
      - type: object
        properties:
          accountId:
            type: string
            description: client account id
            format: uuid
    HouseAccountOutgoingTransferSourceResource:
      type: object
      description: source container for transfers from treasury accounts
      allOf:
      - $ref: '#/components/schemas/OutgoingTransferSourceResource'
      - type: object
        properties:
          accountId:
            type: string
            description: house account id
            format: uuid
    OutgoingTransferAccount:
      type: object
      properties:
        accountHolderName:
          type: string
        bankName:
          type: string
        country:
          type: string
        currency:
          type: string
        routingCodes:
          $ref: '#/components/schemas/RoutingCodeMap'
        accountNumber:
          type: string
        iban:
          type: string
        ledgerNumber:
          type: string
        alias:
          type: string
    OutgoingTransferBeneficiaryResource:
      type: object
      properties:
        fullName:
          type: string
        identity:
          $ref: '#/components/schemas/LegalEntityIdentity'
        address:
          $ref: '#/components/schemas/Address'
        account:
          $ref: '#/components/schemas/OutgoingTransferAccount'
      description: beneficiary
    OutgoingTransferDestinationBeneficiaryBankAccountResource:
      type: object
      description: destination container for transfers to external beneficiary accounts
      allOf:
      - $ref: '#/components/schemas/OutgoingTransferDestinationResource'
      - type: object
        properties:
          beneficiaryId:
            type: string
            format: uuid
          beneficiaryBankAccountId:
            type: string
            description: destination beneficiary bank account id
            format: uuid
    OutgoingTransferDestinationClientAccountResource:
      type: object
      description: destination container for transfers to client accounts

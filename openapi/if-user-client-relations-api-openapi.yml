    get:
      tags:
      - User & Client Relations
      summary: List User Client Relations
      operationId: user-client-relations.list
      parameters:
      - name: metadata.page.number
        in: query
        description: 0-indexed page number
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: metadata.page.size
        in: query
        description: page size
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      - name: metadata.sort
        in: query
        description: default direction is ascending
        schema:
          type: string
        example: data.userClientRelation.clientId,desc
      - name: data.userClientRelation.clientId
        in: query
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: id of user in UUID format
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: User client relation list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserClientRelationListResponse'
              example:
                workflow: {}
                data:
                  userClientRelations:
                  - id: 00000000-0000-0000-0000-000000000000
                    userId: 00000000-0000-0000-0000-000000000000
                    clientId: 00000000-0000-0000-0000-000000000000
                    status: allowed
                connect: {}
                metadata:
                  page:
                    size: 20
                    number: 0
                    totalElements: 1
                    totalPages: 1
    post:
      tags:
      - User & Client Relations
      summary: Create a User Client Relation
      operationId: user-client-relations.create
      parameters:
      - name: userId
        in: path
        description: ID of user in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserClientRelationCreatePlatformRequest'
            examples:
              direct:
                description: direct
                value:
                  workflow:
                    code: direct
                  data:
                    userClientRelations:
                    - clientId: 00000000-0000-0000-0000-000000000000
                    - clientId: 00000000-0000-0000-0000-000000000000
                  connect: '{}'
                  metadata: '{}'
      responses:
        '201':
          description: User client relation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserClientRelationCreatePlatformResponse'
              examples:
                direct:
                  description: direct
                  value:
                    workflow:
                      code: direct
                    data:
                      userClientRelations:
                      - id: 00000000-0000-0000-0000-000000000000
                        userId: 00000000-0000-0000-0000-000000000000
                        clientId: 00000000-0000-0000-0000-000000000000
                        status: allowed
                      - id: 00000000-0000-0000-0000-000000000000
                        userId: 00000000-0000-0000-0000-000000000000
                        clientId: 00000000-0000-0000-0000-000000000000
                        status: allowed
                    connect: '{}'
                    metadata: '{}'
  /users/{userId}/client-relations/{id}:
    get:
      tags:
      - User & Client Relations
      summary: Get a User Client Relation
      operationId: user-client-relations.get
      parameters:
      - name: userId
        in: path
        description: id of user in UUID format
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: id of user client relation in UUID format
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: User client relation returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserClientRelationGetResponse'
              example:
                workflow: {}
                data:
                  userClientRelation:
                    id: 00000000-0000-0000-0000-000000000000
                    userId: 00000000-0000-0000-0000-000000000000
                    clientId: 00000000-0000-0000-0000-000000000000
                    status: allowed
                connect: {}
                metadata: {}
    patch:
      tags:
      - User & Client Relations
      summary: Update a User Client Relation
      operationId: user-client-relations.update
      parameters:
      - name: userId
        in: path
        description: ID of user in UUID format
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: ID of user client relation in UUID format
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserClientRelationUpdatePlatformRequest'
            examples:
              revoking-user-access:
                description: revoking-user-access
                value:
                  workflow:
                    code: direct
                  data:
                    userClientRelation:
                      status: revoked
                  connect: '{}'
                  metadata: '{}'
      responses:
        '202':
          description: User client relation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserClientRelationUpdatePlatformResponse'
              examples:
                revoking-user-access:
                  description: revoking-user-access
                  value:
                    workflow:
                      code: direct
                    data:
                      userClientRelation:
                        id: 00000000-0000-0000-0000-000000000000
                        userId: 00000000-0000-0000-0000-000000000000
                        clientId: 00000000-0000-0000-0000-000000000000
                        status: revoked
                    connect: {}
                    metadata: {}
